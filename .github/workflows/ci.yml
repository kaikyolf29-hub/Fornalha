name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  testes:
    name: Testes (${{ matrix.nome }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Linux
            os: ubuntu-24.04
          - nome: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: ./scripts/apt-instalar.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: Swatinem/rust-cache@v2

      - name: Formatação
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes (núcleo, API, MCP, app)
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --workspace --no-fail-fast

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: MCP de ponta a ponta com o SDK oficial (stdio e HTTP)
        shell: bash
        run: |
          cargo build -p fornalha-cli
          cd testes/mcp-e2e
          npm ci
          node teste.mjs "$GITHUB_WORKSPACE/target/debug/fornalha-cli$( [ "$RUNNER_OS" = Windows ] && echo .exe )"

      - name: Detecção da placa na máquina do CI
        shell: bash
        run: cargo run -q -p fornalha-cli -- detectar

  geracoes:
    name: Gerações de verdade (${{ matrix.nome }}) — Blender, Godot e o jogo
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Linux
            os: ubuntu-24.04
          - nome: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: geracoes

      - name: Bibliotecas do Blender e tela virtual (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: ./scripts/apt-instalar.sh xvfb xauth libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libgl1-mesa-dri unzip

      # Sem cache de propósito: a cada execução prova o botão Máquina → Programas → Baixar (curl e tar
      # do sistema — no Windows os de System32 —, versão fixa e soma publicada conferida)
      - name: Baixar o Blender e a Godot pelo botão da Fornalha
        shell: bash
        run: |
          cargo build -q -p fornalha-cli
          base="$HOME/ferramentas-fornalha"
          if [ "$RUNNER_OS" = "Windows" ]; then base="$(cygpath -w "$base")"; fi
          for p in godot blender; do FORNALHA_HOME="$base" ./target/debug/fornalha-cli baixar-programa $p; done
          dir="$HOME/ferramentas-fornalha/dados/ferramentas"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "FORNALHA_TESTE_BLENDER=$(cygpath -w "$dir/blender/blender.exe")" >> "$GITHUB_ENV"
            echo "FORNALHA_TESTE_GODOT=$(cygpath -w "$dir/godot/godot_console.exe")" >> "$GITHUB_ENV"
          else
            echo "FORNALHA_TESTE_BLENDER=$dir/blender/blender" >> "$GITHUB_ENV"
            echo "FORNALHA_TESTE_GODOT=$dir/godot/godot" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dos workers de placa (numpy e Pillow)
        shell: bash
        run: python -m pip install numpy pillow

      - name: Cache dos pacotes de conteúdo (MakeHuman, animações e materiais, CC0)
        uses: actions/cache@v4
        with:
          path: ~/pacotes
          key: pacotes-v2-${{ runner.os }}

      - name: Baixar os pacotes de conteúdo (como o botão Baixar da janela)
        shell: bash
        run: |
          cargo build -q -p fornalha-cli
          base="$HOME/pacotes"
          if [ "$RUNNER_OS" = "Windows" ]; then base="$(cygpath -w "$base")"; fi
          for p in makehuman animacoes materiais; do
            if [ ! -f "$HOME/pacotes/dados/pacotes/$p/pacote.json" ]; then
              FORNALHA_HOME="$base" ./target/debug/fornalha-cli baixar-pacote $p | tail -3
            fi
            dir="$HOME/pacotes/dados/pacotes/$p"
            if [ "$RUNNER_OS" = "Windows" ]; then dir="$(cygpath -w "$dir")"; fi
            echo "FORNALHA_PACOTE_$(echo $p | tr a-z A-Z)=$dir" >> "$GITHUB_ENV"
          done

      - name: Gerações (Forja, engine, workers de placa e o pronto da Fase 4 pelo MCP)
        shell: bash
        env:
          FORNALHA_TESTE_SAIDA: ${{ github.workspace }}/geracoes
          FORNALHA_TESTE_VIDEO: "1"
          RUST_BACKTRACE: "1"
        run: |
          mkdir -p geracoes
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" cargo test -p fornalha-core --test forja --test engine --test geracao --test workers -- --test-threads 1 --nocapture
          else
            cargo test -p fornalha-core --test forja --test engine --test geracao --test workers -- --test-threads 1 --nocapture
          fi

      # Pedido 14 da Erethea: a engine principal instalada pelo botão da Fornalha (instalador público,
      # versão fixa e SHA-256 conferido) e os testes de engine rodando nela também, não só na Godot
      - name: Baixar a Erethea pelo botão da Fornalha (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src=crates/fornalha-core/src/programas.rs
          versao=$(grep -o 'ERETHEA_VERSAO: &str = "[^"]*"' $src | grep -o '"[^"]*"' | tr -d '"')
          fixada=$(grep -A3 'arquivo: "erethea-setup-x86_64.exe"' $src | grep -o '[0-9a-f]\{64\}' | head -1)
          publicada=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/kaikyolf29-hub/-Erethea-Engine/releases/tags/v$versao" \
            | python -c "import json,sys; r=json.load(sys.stdin); print(next(a['digest'] for a in r['assets'] if a['name']=='erethea-setup-x86_64.exe').split(':')[-1])")
          echo "Erethea $versao: soma fixada $fixada, publicada $publicada"
          [ -n "$fixada" ] && [ "$fixada" = "$publicada" ]
          ultima=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/kaikyolf29-hub/-Erethea-Engine/releases/latest | python -c "import json,sys; print(json.load(sys.stdin)['tag_name'])" || true)
          [ "$ultima" != "v$versao" ] && echo "::warning::Há Erethea mais nova ($ultima): atualize ERETHEA_VERSAO e a soma no programas.rs"
          base="$(cygpath -w "$HOME/ferramentas-fornalha")"
          FORNALHA_HOME="$base" ./target/debug/fornalha-cli baixar-programa erethea
          echo "FORNALHA_TESTE_ERETHEA=$(cygpath -w "$HOME/ferramentas-fornalha/dados/ferramentas/erethea/erethea.console.exe")" >> "$GITHUB_ENV"

      - name: Testes de engine na Erethea (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          FORNALHA_TESTE_SAIDA: ${{ github.workspace }}/geracoes/erethea
          RUST_BACKTRACE: "1"
        run: |
          mkdir -p geracoes/erethea
          "$FORNALHA_TESTE_ERETHEA" --version || true
          cargo test -p fornalha-core --test engine -- --test-threads 1 --nocapture

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geracoes-${{ matrix.nome }}
          path: geracoes/
          retention-days: 30
