name: ComfyUI 3D (cabeça por partes)

# 3D por partes no ComfyUI de verdade, sem placa: a cabeça é recortada do conceito do corpo inteiro
# (o templário da referência do criador, gerado no "ComfyUI 3D" de 23/11), refinada em close pelo
# Z-Image (imagem → imagem, mesmo desenho) e vira malha própria no TRELLIS.2 (MIT). O Blender encaixa
# essa cabeça no corpo antes do esqueleto. O criador aceitou a licença do DINOv3 para os testes em
# 22/11/2026; na máquina da pessoa o aceite é pela janela.

on:
  workflow_dispatch:
  push:
    paths:
      - "crates/fornalha-core/src/partes.rs"
      - ".github/workflows/comfyui-3d-cabeca.yml"

concurrency:
  group: comfyui-3d-cabeca-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cabeca:
    name: Cabeça em close (refino + TRELLIS.2 no processador)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      FORNALHA_HOME: ${{ github.workspace }}-home
    steps:
      - name: Espaço em disco (os modelos do 3D têm ~8,5 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar a Fornalha (linha de comando)
        run: cargo build -q -p fornalha-cli
      - name: Instalar o ComfyUI com o 3D pela IA (pelo instalador da Fornalha)
        run: |
          ./target/debug/fornalha-cli comfyui instalar --backend cpu --modelos gguf --3d
          df -h /
      - name: Cabeça por partes
        env:
          RUST_BACKTRACE: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/cabeca"
          ./target/debug/fornalha-cli comfyui abrir
          ./target/debug/fornalha-cli comfyui cabeca crates/fornalha-core/tests/dados/templario_referencia_conceito.png \
            --saida "$RUNNER_TEMP/cabeca" --horas 5 \
            --pedido "medieval Templar knight, polished steel great helm with eye slits and breathing holes, chainmail coif, white linen hood, white surcoat with a black cross pattee, steel pauldrons" \
            | tee "$RUNNER_TEMP/cabeca/saida.json"
          test -s "$RUNNER_TEMP/cabeca/cabeca_trellis2.glb"
      - name: Registro
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/cabeca"
          cp "$FORNALHA_HOME/dados/comfyui/comfyui.log" "$RUNNER_TEMP/cabeca/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comfyui-3d-cabeca
          path: ${{ runner.temp }}/cabeca
