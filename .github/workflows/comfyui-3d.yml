name: ComfyUI 3D (imagem para malha)

# 3D pela IA no ComfyUI de verdade, sem placa: o TRELLIS.2 (MIT, nós nativos do ComfyUI) transforma a
# imagem de conceito gerada pela Fornalha numa malha texturizada (.glb). O criador aceitou a licença do
# codificador DINOv3 (Meta) para estes testes em 22/11/2026; na máquina da pessoa o aceite é pela janela.
# 1) "nos": lista oficial dos nós (/object_info), para a Fornalha converter os fluxos oficiais.
# 2) "malha": imagem → malha com o TRELLIS.2 no processador (lento: pode levar horas).

on:
  workflow_dispatch:
  push:
    paths:
      - "crates/fornalha-core/src/comfyui.rs"
      - "crates/fornalha-core/workers/instalar_comfyui.py"
      - "crates/fornalha-core/tests/comfyui_3d_real.rs"
      - ".github/workflows/comfyui-3d.yml"

concurrency:
  group: comfyui-3d-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  nos:
    name: Lista de nós do ComfyUI
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FORNALHA_HOME: ${{ github.workspace }}-home
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o ComfyUI (sem modelos) e abrir
        run: |
          cargo build -q -p fornalha-cli
          ./target/debug/fornalha-cli comfyui instalar --backend cpu --modelos nenhum
          ./target/debug/fornalha-cli comfyui abrir
          mkdir -p saida
          curl -s http://127.0.0.1:8188/object_info > saida/object_info.json
          curl -s http://127.0.0.1:8188/system_stats > saida/system_stats.json
          python -c "import json; d=json.load(open('saida/object_info.json')); print(len(d), 'nós'); print([k for k in d if 'rellis' in k or 'Mesh' in k])"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comfyui-object-info
          path: saida

  malha:
    name: Imagem para malha (TRELLIS.2 no processador)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      FORNALHA_HOME: ${{ github.workspace }}-home
    steps:
      - name: Espaço em disco (os modelos do 3D têm ~8,5 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar a Fornalha (linha de comando) e o teste
        run: |
          cargo build -q -p fornalha-cli
          cargo test -q -p fornalha-core --test comfyui_3d_real --no-run
      - name: Instalar o ComfyUI com o 3D pela IA (pelo instalador da Fornalha)
        run: |
          ./target/debug/fornalha-cli comfyui instalar --backend cpu --modelos nenhum --3d
          cat "$FORNALHA_HOME/dados/comfyui/instalacao.json"
          df -h /
      - name: Abrir o ComfyUI e gerar a malha
        env:
          FORNALHA_TESTE_COMFYUI_3D: "8188"
          FORNALHA_TESTE_SAIDA: ${{ runner.temp }}/comfyui-3d-saida
          FORNALHA_TESTE_HORAS: "5"
          RUST_BACKTRACE: "1"
        run: |
          mkdir -p "$FORNALHA_TESTE_SAIDA"
          ./target/debug/fornalha-cli comfyui abrir
          cargo test -p fornalha-core --test comfyui_3d_real -- --nocapture
      - name: Registro
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/comfyui-3d-saida"
          cp "$FORNALHA_HOME/dados/comfyui/comfyui.log" "$FORNALHA_HOME/dados/comfyui/instalacao.log" "$RUNNER_TEMP/comfyui-3d-saida/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comfyui-3d-malha
          path: ${{ runner.temp }}/comfyui-3d-saida
