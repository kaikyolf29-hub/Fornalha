name: ComfyUI no processador

# Motor de imagem de verdade instalado pelo PRÓPRIO instalador da Fornalha (o mesmo que roda na máquina
# da pessoa: `fornalha-cli comfyui instalar`), sem placa, no Windows e no Linux: baixa o Z-Image Turbo
# quantizado (Apache 2.0) e a Fornalha gera referências (personagem, criatura, cenário e folha de
# modelo). As imagens viram artefato.
# - ComfyUI no processador (Windows e Linux).
# - Motor Vulkan (stable-diffusion.cpp), o caminho da RX 580: no Windows é o mesmo executável que vai
#   para a placa (aqui, sem placa, ele cai para o processador); no Linux roda o Vulkan por software
#   (lavapipe do Mesa), experimental porque é lento. O ComfyUI tirou o DirectML em 11/11/2026.
# Roda quando o conector ou o instalador mudam, e à mão (Actions → ComfyUI no processador → Run workflow).

on:
  workflow_dispatch:
    inputs:
      lado:
        description: "Lado da imagem em pixels (512 é rápido no processador; 1024 leva bem mais)"
        default: "512"
  push:
    paths:
      - "crates/fornalha-core/src/comfyui.rs"
      - "crates/fornalha-core/workers/instalar_comfyui.py"
      - "crates/fornalha-core/tests/comfyui_real.rs"
      - "crates/fornalha-cli/src/main.rs"
      - ".github/workflows/comfyui.yml"

concurrency:
  group: comfyui-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  comfyui:
    name: Motor ${{ matrix.backend }} (${{ matrix.nome }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 200
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Windows
            os: windows-latest
            backend: cpu
            experimental: false
          - nome: Linux
            os: ubuntu-24.04
            backend: cpu
            experimental: false
          - nome: Windows
            os: windows-latest
            backend: vulkan
            experimental: false
          - nome: Linux
            os: ubuntu-latest
            backend: vulkan
            experimental: true
    env:
      FORNALHA_HOME: ${{ github.workspace }}/../fornalha-home
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Modelos guardados entre execuções
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../fornalha-home/dados/comfyui/ComfyUI/models/diffusion_models
            ${{ github.workspace }}/../fornalha-home/dados/comfyui/ComfyUI/models/text_encoders
            ${{ github.workspace }}/../fornalha-home/dados/comfyui/ComfyUI/models/vae
          key: comfyui-modelos-z-image-turbo-q4km-v2

      - name: Compilar a Fornalha (linha de comando) e o teste
        run: |
          cargo build -p fornalha-cli
          cargo test -p fornalha-core --test comfyui_real --no-run

      - name: Vulkan por software (lavapipe) no Linux
        if: matrix.backend == 'vulkan' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools && vulkaninfo --summary || true

      - name: Instalar o motor pelo instalador da Fornalha
        shell: bash
        run: |
          cargo run -q -p fornalha-cli -- comfyui instalar --backend ${{ matrix.backend }} --modelos gguf
          cat "$FORNALHA_HOME/dados/comfyui/instalacao.json"

      - name: Gerar as referências pelo motor
        shell: bash
        env:
          FORNALHA_TESTE_SAIDA: ${{ runner.temp }}/comfyui-saida
          FORNALHA_TESTE_LADO: ${{ (matrix.backend == 'vulkan' && runner.os == 'Linux') && '256' || github.event.inputs.lado || '512' }}
          FORNALHA_TESTE_SO_UM: ${{ (matrix.backend == 'vulkan' && runner.os == 'Linux') && '1' || '' }}
          RUST_BACKTRACE: "1"
        run: |
          set -e
          [ -z "$FORNALHA_TESTE_SO_UM" ] && unset FORNALHA_TESTE_SO_UM
          mkdir -p "$FORNALHA_TESTE_SAIDA"
          if [ "${{ matrix.backend }}" = "vulkan" ]; then
            cargo run -q -p fornalha-cli -- comfyui estado
            export FORNALHA_TESTE_VULKAN=1
          else
            cargo run -q -p fornalha-cli -- comfyui abrir
            export FORNALHA_TESTE_COMFYUI=8188
          fi
          cargo test -p fornalha-core --test comfyui_real -- --nocapture

      - name: Imagens e registro
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/comfyui-saida"
          cp "$FORNALHA_HOME/dados/comfyui/comfyui.log" "$FORNALHA_HOME/dados/comfyui/instalacao.log" "$RUNNER_TEMP/comfyui-saida/" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comfyui-${{ matrix.backend }}-${{ matrix.nome }}
          path: ${{ runner.temp }}/comfyui-saida
          if-no-files-found: warn
