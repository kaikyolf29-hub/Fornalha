[workspace]
resolver = "2"
members = [
    "crates/fornalha-core",
    "crates/fornalha-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
repository = "https://github.com/kaikyolf29-hub/Fornalha"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "6"
tempfile = "3"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
